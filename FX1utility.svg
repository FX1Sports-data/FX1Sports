        <text class="body business-line" x="128" y="418"><tspan style="font-weight:800">EARN</tspan> <tspan fill="#7fd8cc" style="font-weight:800">SHOTS</tspan> &amp; <tspan style="font-weight:800">CONVERT</tspan></text>
        <text class="body business-line" x="128" y="450"><tspan style="font-weight:800">TO</tspan> <tspan fill="#70ed69" style="font-weight:800">$FXI</tspan></text>
      <g class="glow">
        <ellipse cx="508" cy="398" rx="18" ry="7" class="icon"/><path d="M490 398V417C490 422 498 426 508 426S526 422 526 417V398M490 408C490 413 498 417 508 417S526 413 526 408" class="icon"/>
        <ellipse cx="488" cy="420" rx="18" ry="7" class="icon"/><path d="M470 420V439C470 444 478 448 488 448S506 444 506 439V420M470 430C470 435 478 439 488 439S506 435 506 430" class="icon"/>
        <circle cx="526" cy="441" r="16" fill="#06131a" stroke="#1fb9c9" stroke-width="1.8"/><text x="526" y="447" text-anchor="middle" style="font-size:19px;font-weight:700;fill:#70ed69">$</text>
      </g>
    </g>
    <path d="M54 484H544" stroke="#14535c" stroke-width="1.5"/>

    <g>
      <text x="55" y="576" style="font-size:72px;font-weight:800;fill:#70ed69">3</text>
        <text class="body business-line" x="128" y="540"><tspan style="font-weight:800">USE</tspan> <tspan fill="#70ed69" style="font-weight:800">$FXI</tspan> TO SPEND, HOLD,</text>
        <text class="body business-line" x="128" y="572">OR LOCK INSIDE ARENA</text>
      <g class="glow">
        <rect x="481" y="510" width="52" height="60" rx="5" fill="#06131a" stroke="#1fb9c9" stroke-width="2"/>
        <circle cx="507" cy="538" r="18" class="icon"/><circle cx="507" cy="538" r="10" class="icon-pink"/>
        <path d="M499 538H515M507 530V546M522 552V564M518 552V548Q522 540 526 548V552" class="icon"/>
      </g>
    </g>

    <rect x="47" y="609" width="504" height="205" rx="11" fill="#07141a" stroke="#14535c" stroke-width="1.6"/>
    <text x="68" y="647" class="utility-heading" style="font-weight:700;fill:#7fd8cc">SIMPLE ON THE SURFACE</text>
    <text class="body utility-summary" x="68" y="684">User participation improves AI validation,</text>
    <text class="body utility-summary" x="68" y="721">improves FX1's products, and drives</text>
    <text class="body utility-summary" x="68" y="758">commercial revenue. Engagement is</text>
    <text class="body utility-summary" x="68" y="795">productive, not just entertaining.</text>
  </g>

  <!-- Panel 2: Commercial business -->
