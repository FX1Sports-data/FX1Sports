      <text x="1440" y="268" style="font-size:23px;font-weight:800;fill:#7fd8cc">STRUCTURED TRAINING</text>
      <text x="1440" y="298" style="font-size:23px;font-weight:800;fill:#7fd8cc">&amp; VALIDATION</text>
      <text class="flow-copy" x="1440" y="338">Your structured tasks directly</text>
      <text class="flow-copy" x="1440" y="368">improve FX1's AI systems.</text>
      <text class="flow-copy" x="1440" y="398">Your activity is productive,</text>
      <text class="flow-copy" x="1440" y="428">not just entertaining.</text>
    </g>

    <g class="learn-copy">
      <text x="1440" y="565" style="font-size:23px;font-weight:800;fill:#7fd8cc">REVENUE-DRIVEN ECONOMY</text>
      <text class="flow-copy" x="1440" y="601">Sponsors, enterprises and rights holders</text>
      <text class="flow-copy" x="1440" y="635">pay for tools, data and engagement.</text>
      <text class="flow-copy" x="1440" y="669">That revenue strengthens the $FXI treasury</text>
      <text class="flow-copy" x="1440" y="703">and anchors the token side to actual</text>
      <text class="flow-copy" x="1440" y="737">operating revenue, not trading volume.</text>
    </g>

    <text x="1680" y="836" style="font-size:14px;font-weight:700;fill:#7fd8cc">FX1.IO</text>
    <text x="1736" y="842" text-anchor="middle" style="font-size:30px;font-weight:800;font-style:italic;fill:#fff">FX<tspan fill="#1fb9c9">1</tspan></text>
  </g>

  <script><![CDATA[
    var stages = [].slice.call(document.querySelectorAll(".panel-stage"));
    var businessItems = [].slice.call(document.querySelectorAll(".business-item"));
    var revenueSummary = document.querySelector(".revenue-summary");
    var learnSteps = [].slice.call(document.querySelectorAll(".learn-step"));
    var learnCopies = [].slice.call(document.querySelectorAll("#panel3 .learn-copy"));
    stages.forEach(function(stage, index) {
      function advance() {
        var next = stages[index + 1];
        if (!next || !next.classList.contains("panel-stage-hidden")) return;
        next.classList.remove("panel-stage-hidden");
        stage.setAttribute("aria-expanded", "true");
        if (next.id === "panel2") {
          businessItems.forEach(function(item, itemIndex) {
            window.setTimeout(function() {
              item.classList.add("business-item-visible");
            }, itemIndex * 750);
          });
          window.setTimeout(function() {
            revenueSummary.classList.add("revenue-summary-visible");
          }, (businessItems.length - 1) * 750 + 1000);
        }
        if (next.id === "panel3") {
          learnSteps.forEach(function(step, stepIndex) {
            window.setTimeout(function() {
              step.classList.add("learn-step-visible");
            }, stepIndex * 500);
          });
          learnCopies.forEach(function(copy, copyIndex) {
            window.setTimeout(function() {
              copy.classList.add("learn-copy-visible");
            }, (learnSteps.length - 1) * 500 + 750 + copyIndex * 750);
          });
        }
      }
      stage.addEventListener("click", advance);
      stage.addEventListener("keydown", function(event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          advance();
        }
      });
    });
  ]]></script>
</svg>
