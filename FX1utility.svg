<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" width="100%" role="img" aria-labelledby="svg-title svg-desc" lang="en">
  <title id="svg-title">FX1 Token Utility &amp; Commercial Revenue Loop System</title>
  <desc id="svg-desc">An interactive three-panel infographic showing the $FXI user loop, FX1 commercial revenue lines, and MotionAI Learn's productive economy flow.</desc>
  <defs>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1fb9c9" stroke-width=".5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L8 4.5L0 9Z" fill="#1fb9c9"/>
    </marker>
    <style><![CDATA[
      @import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap");
      text { font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif; fill: #e9f4f5; }
      .bg { fill: #04090c; }
      .grid { fill: url(#grid); opacity: .1; }
      .panel { fill: #06131a; stroke: #1fb9c9; stroke-width: 2.5; }
      .card { fill: #07141a; stroke: #14535c; stroke-width: 1.8; }
      .panel-stage { cursor: pointer; outline: none; }
      .panel-stage-hidden { display: none; }
      .panel-stage > .panel { transition: stroke .2s ease, filter .2s ease; }
      .panel-stage:hover > .panel, .panel-stage:focus > .panel { stroke: #4ade50; filter: url(#glow); }
      .business-item, .revenue-summary, .learn-step, .learn-copy { opacity: 0; visibility: hidden; transition: opacity .3s ease; }
      .business-item-visible, .revenue-summary-visible, .learn-step-visible, .learn-copy-visible { opacity: 1; visibility: visible; }
      .title { font-size: 42px; font-weight: 800; }
      .section { fill: #7fd8cc; font-size: 28px; font-weight: 800; }
      .subsection { fill: #7fd8cc; font-size: 22px; font-weight: 700; }
      .body { font-size: 21px; font-weight: 500; }
      .business-line { font-size: 24px; }
      .business-line-note { font-size: 20px; }
      .flow-copy { font-size: 21px; }
      .utility-summary { font-size: 29px; }
      .utility-heading { font-size: 24px; }
      .revenue-note { font-size: 20px; }
      .small { font-size: 18px; font-weight: 500; }
      .small.revenue-note { font-size: 22px; }
      .cyan { fill: #1fb9c9; }
      .mint { fill: #7fd8cc; }
      .pink { fill: #f472b6; }
      .green { fill: #70ed69; }
      .icon { fill: none; stroke: #1fb9c9; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-pink { fill: none; stroke: #f472b6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .flow { fill: none; stroke: #1fb9c9; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-cyan); }
      .glow { filter: url(#glow); }
    ]]></style>
  </defs>

  <rect class="bg" width="1800" height="900"/>
  <rect class="grid" width="1800" height="900"/>
  <path d="M25 18H49L82 50L49 82H25L57 50Z" fill="#1fb9c9"/>
  <path d="M49 18H73L105 50L73 82H49L81 50Z" fill="#1fb9c9" opacity=".8"/>
  <text x="120" y="73" style="font-size:58px;font-weight:800;font-style:italic;fill:#fff">FX<tspan fill="#1fb9c9">1</tspan></text>
  <text class="title" x="252" y="65">TOKEN UTILITY &amp; COMMERCIAL REVENUE LOOP SYSTEM</text>
  <text x="254" y="96" style="font-size:16px;fill:#f472b6">Click each panel to reveal the next</text>
  <path d="M24 110H1776" stroke="#14535c" stroke-width="1.5"/>
  <path d="M24 110H482" stroke="#1fb9c9" stroke-width="3" filter="url(#glow)"/>

  <!-- Panel 1: Token utility -->
