    <path class="panel" d="M1200 128H1754Q1776 128 1776 150V776Q1776 804 1748 804H1690C1665 804 1650 848 1630 848H1200Q1176 848 1176 824V152Q1176 128 1200 128Z"/>
    <text class="section" x="1202" y="172">MOTIONAI LEARN:</text>
    <text class="section" x="1202" y="207">PRODUCTIVE ECONOMY FLOW</text>

    <g class="learn-step">
      <g class="glow"><rect x="1204" y="244" width="39" height="48" rx="3" fill="#06131a" stroke="#1fb9c9" stroke-width="1.8"/><path d="M1212 255H1234M1212 263H1234M1212 271H1228M1213 280L1218 285L1233 270" class="icon-pink"/></g>
      <text class="body" x="1320" y="267" text-anchor="middle">structured tasks</text>
      <path class="flow" d="M1320 283V320"/>
    </g>
    <g class="learn-step">
      <g class="glow"><circle cx="1223" cy="356" r="20" class="icon"/><circle cx="1223" cy="356" r="8" class="icon-pink"/><path d="M1223 328V336M1223 376V384M1195 356H1203M1243 356H1251M1203 336L1209 342M1237 370L1243 376M1243 336L1237 342M1209 370L1203 376" class="icon"/></g>
      <text class="body" x="1320" y="352" text-anchor="middle">improve AI</text><text class="body" x="1320" y="377" text-anchor="middle">systems</text>
      <path class="flow" d="M1320 390V417"/>
    </g>
    <g class="learn-step">
      <g class="glow"><path d="M1201 465L1237 429M1230 429H1237V436" class="icon"/><path d="M1201 470H1242" class="icon-pink"/></g>
      <text class="body" x="1320" y="447" text-anchor="middle">improve MotionAI</text><text class="body" x="1320" y="472" text-anchor="middle">data quality</text>
      <path class="flow" d="M1320 488V525"/>
    </g>
    <g class="learn-step">
      <g class="glow"><rect x="1203" y="536" width="39" height="45" rx="3" fill="#06131a" stroke="#1fb9c9" stroke-width="1.8"/><path d="M1210 545H1234M1210 553H1234M1210 561H1225" class="icon"/><circle cx="1232" cy="574" r="8" fill="#06131a" stroke="#1fb9c9" stroke-width="1.5"/><path d="M1228 574L1231 577L1236 571" class="icon-pink"/></g>
      <text class="body" x="1320" y="557" text-anchor="middle">improved FX1</text><text class="body" x="1320" y="582" text-anchor="middle">products</text>
      <path class="flow" d="M1320 594V621"/>
    </g>
    <g class="learn-step">
      <g class="glow"><circle cx="1223" cy="656" r="18" class="icon"/><circle cx="1223" cy="656" r="13" class="icon-pink"/><text x="1223" y="663" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#70ed69">$</text></g>
      <text class="body" x="1320" y="650" text-anchor="middle">drive commercial</text><text class="body" x="1320" y="675" text-anchor="middle">revenue</text>
      <path class="flow" d="M1320 688V725"/>
    </g>
    <g class="learn-step">
      <g class="glow"><rect x="1202" y="737" width="42" height="41" rx="4" fill="#06131a" stroke="#1fb9c9" stroke-width="1.8"/><circle cx="1223" cy="757" r="14" class="icon"/><circle cx="1223" cy="757" r="6" class="icon-pink"/></g>
      <text class="body" x="1320" y="755" text-anchor="middle">strengthens</text><text class="body" x="1320" y="780" text-anchor="middle">Arena</text>
    </g>

    <path d="M1415 234V776" stroke="#14535c" stroke-width="1.5"/>
