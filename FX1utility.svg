    </g>
    <g class="business-item">
      <text x="631" y="478" style="font-size:53px;font-weight:800;fill:#70ed69">4.</text>
      <text class="body business-line" x="696" y="474">HeadShield Safety Intelligence</text>
      <g class="glow" transform="translate(-34 0)"><path d="M1090 445L1111 452V470C1111 484 1090 494 1090 494S1069 484 1069 470V452Z" class="icon"/><path d="M1080 468L1087 475L1101 459" class="icon-pink"/></g>
    </g>
    <g class="business-item">
      <text x="631" y="546" style="font-size:53px;font-weight:800;fill:#70ed69">5.</text>
      <text class="body business-line" x="696" y="542">Rights Holder Partnerships</text>
      <g class="glow" transform="translate(-34 0)"><path d="M1070 530L1084 520L1097 528L1110 523L1113 532L1102 539L1089 536L1081 544Z" class="icon"/><path d="M1079 542L1089 550L1099 542L1108 548" class="icon-pink"/></g>
    </g>
    <g class="business-item">
      <text x="631" y="614" style="font-size:53px;font-weight:800;fill:#70ed69">6.</text>
      <text class="body business-line" x="696" y="610">Arena Platform Commerce itself</text>
      <g class="glow" transform="translate(-34 0)"><path d="M1071 593H1110V604H1071ZM1076 604V625M1087 604V625M1098 604V625M1106 604V625M1069 625H1112" class="icon"/><path d="M1069 593L1074 585H1107L1112 593" class="icon-pink"/></g>
    </g>

    <g class="revenue-summary">
    <rect x="620" y="646" width="510" height="188" rx="11" fill="#07141a" stroke="#14535c" stroke-width="1.6"/>
    <text class="subsection" x="638" y="678">REAL REVENUE LINES. NON-TRADING DRIVEN.</text>
    <text class="small revenue-note" x="638" y="710">A defined share of net revenue from these businesses flows</text>
    <text class="small revenue-note" x="638" y="742">directly into the <tspan fill="#70ed69">$FXI treasury</tspan>, funding buybacks,</text>
    <text class="small revenue-note" x="638" y="774">jackpots and ecosystem programs. Commercial activity</text>
    <text class="small revenue-note" x="638" y="806">anchors utility to operating revenue, not trading volume.</text>
    </g>
  </g>

  <!-- Panel 3: MotionAI Learn -->
