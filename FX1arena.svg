<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 768" width="100%" role="img" aria-labelledby="svg-title svg-desc" lang="en">
  <title id="svg-title">FX1 Arena: Play, Earn &amp; Power AI Data</title>
  <desc id="svg-desc">Three panels explain FX1 Arena gameplay, rewards, and how its real-data token economy differs from other fan apps.</desc>
  <defs>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
