      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1fb9c9" stroke-width=".5"/>
    </pattern>
    <style><![CDATA[
      @import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap");
      text { font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif; fill: #e9f4f5; }
      .bg { fill: #04090c; }
      .grid { fill: url(#grid); opacity: .12; }
      .panel { fill: #06131a; stroke: #1fb9c9; stroke-width: 2.5; }
      .panel-stage { cursor: pointer; outline: none; }
      .panel-stage-hidden { display: none; }
      .panel-stage > .panel { transition: stroke .2s ease, filter .2s ease; }
      .panel-stage:hover > .panel, .panel-stage:focus > .panel { stroke: #4ade50; filter: url(#glow); }
      .reward-item { opacity: 0; visibility: hidden; transition: opacity .25s ease; }
      .reward-item-visible { opacity: 1; visibility: visible; }
      .reward-summary { opacity: 0; visibility: hidden; transform-box: fill-box; transform-origin: center; }
      .reward-summary-visible { visibility: visible; animation: reward-bounce 2s ease-out both; }
      @keyframes reward-bounce {
        0% { opacity: 0; transform: translateY(-18px) scale(.88); }
        18% { opacity: 1; transform: translateY(0) scale(1.1); }
        34% { transform: translateY(-8px) scale(.97); }
        50% { transform: translateY(0) scale(1.03); }
        65% { transform: translateY(-3px) scale(.99); }
        80%, 100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      .card { fill: #07141a; stroke: #14535c; stroke-width: 2; }
      .mint { fill: #7fd8cc; }
      .cyan { fill: #1fb9c9; }
      .pink { fill: #f472b6; }
      .green { fill: #70ed69; }
      .title { font-size: 46px; font-weight: 800; }
      .section { font-size: 31px; font-weight: 800; fill: #7fd8cc; }
      .subsection { font-size: 28px; font-weight: 500; }
      .body { font-size: 22px; font-weight: 500; }
      .difference-content .body { font-size: 23px; }
      .body-strong { font-size: 23px; font-weight: 700; }
      .small { font-size: 19px; font-weight: 500; }
      .icon { fill: none; stroke: #1fb9c9; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-pink { fill: none; stroke: #f472b6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .glow { filter: url(#glow); }
    ]]></style>
