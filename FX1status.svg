<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1710 820" width="100%" role="img" aria-labelledby="svg-title svg-desc" lang="en">
  <title id="svg-title">FX1 Status &amp; Benefits: OG &amp; Heritage System</title>
  <desc id="svg-desc">An interactive three-panel overview of FX1 Heritage status, OG holder benefits, and access protection.</desc>
  <defs>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1fb9c9" stroke-width=".5"/>
