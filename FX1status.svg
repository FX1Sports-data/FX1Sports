    <style><![CDATA[
      @import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap");
      text { font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif; fill: #e9f4f5; }
      .bg { fill: #04090c; }
      .grid { fill: url(#grid); opacity: .1; }
      .panel { fill: #06131a; stroke: #1fb9c9; stroke-width: 2.5; }
      .card { fill: #07141a; stroke: #14535c; stroke-width: 1.8; }
      .panel-stage { cursor: pointer; outline: none; }
      .panel-stage-hidden { display: none; }
      .panel-stage > .panel { transition: stroke .2s ease, filter .2s ease; }
      .panel-stage:hover > .panel, .panel-stage:focus > .panel { stroke: #4ade50; filter: url(#glow); }
      .benefit-item { opacity: 0; visibility: hidden; transition: opacity .25s ease; }
      .benefit-item-visible { opacity: 1; visibility: visible; }
      .title { font-size: 43px; font-weight: 800; }
      .section { fill: #7fd8cc; font-size: 29px; font-weight: 800; }
      .subsection { fill: #7fd8cc; font-size: 22px; font-weight: 700; }
      .body { font-size: 22px; font-weight: 500; }
      .layer-title { font-size: 31px; font-weight: 800; }
      .layer-detail { font-size: 28px; }
      .summary-copy { font-size: 26px; }
      .benefit-icon { transform-box: fill-box; transform-origin: center; transform: scale(1.12); }
      .og-benefits-icon { transform-box: fill-box; transform-origin: center; transform: scale(1.15); }
      .hierarchy-icon { transform-box: fill-box; transform-origin: center; transform: scale(1.2); }
      .hierarchy-label { font-size: 26px; font-weight: 800; }
      .protection-heading { font-size: 23px; font-weight: 800; fill: #7fd8cc; }
      .protection-copy { font-size: 26px; }
      .small { font-size: 18px; font-weight: 500; }
      .cyan { fill: #1fb9c9; }
      .mint { fill: #7fd8cc; }
      .pink { fill: #f472b6; }
      .green { fill: #70ed69; }
      .icon { fill: none; stroke: #1fb9c9; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-pink { fill: none; stroke: #f472b6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .flow { fill: none; stroke: #1fb9c9; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-cyan); }
      .glow { filter: url(#glow); }
    ]]></style>
